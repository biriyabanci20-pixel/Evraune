<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ÉVRAUNE — Parfüm</title>

<meta name="description" content="ÉVRAUNE — Zamansız kokular, unutulmaz izler.">

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#f5f1eb;
    color:#171513;
    font-family:'Montserrat',sans-serif;
}

button{
    font-family:inherit;
    cursor:pointer;
}

a{
    color:inherit;
    text-decoration:none;
}

/* HEADER */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;
    padding:22px 6%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(245,241,235,.88);
    backdrop-filter:blur(15px);
    border-bottom:1px solid rgba(0,0,0,.08);
}

.logo{
    font-family:'Cormorant Garamond',serif;
    font-size:34px;
    letter-spacing:6px;
    font-weight:600;
}

nav{
    display:flex;
    gap:35px;
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
}

nav a{
    transition:.3s;
}

nav a:hover{
    opacity:.5;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:18px;
}

.icon-btn{
    background:none;
    border:0;
    font-size:21px;
}

.cart-count{
    position:relative;
}

.cart-number{
    position:absolute;
    top:-9px;
    right:-9px;
    width:17px;
    height:17px;
    background:#171513;
    color:white;
    border-radius:50%;
    font-size:9px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* HERO */

.hero{
    min-height:100vh;
    padding:150px 7% 70px;
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:center;
    gap:60px;
}

.hero-text{
    max-width:600px;
}

.eyebrow{
    font-size:11px;
    letter-spacing:5px;
    text-transform:uppercase;
    margin-bottom:25px;
    opacity:.65;
}

.hero h1{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(70px,9vw,135px);
    line-height:.78;
    font-weight:500;
    letter-spacing:-4px;
}

.hero h1 span{
    display:block;
    font-style:italic;
    margin-left:70px;
}

.hero p{
    margin:38px 0;
    max-width:450px;
    line-height:1.9;
    font-size:14px;
    color:#68625b;
}

.primary-btn{
    border:0;
    background:#171513;
    color:white;
    padding:17px 32px;
    font-size:11px;
    letter-spacing:3px;
    text-transform:uppercase;
    transition:.3s;
}

.primary-btn:hover{
    transform:translateY(-3px);
    background:#3c3731;
}

/* BOTTLE */

.hero-bottle-area{
    min-height:600px;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

.hero-bottle{
    width:250px;
    height:390px;
    background:linear-gradient(110deg,#c9b39a,#f4e8d5,#b69b7b);
    border-radius:28px 28px 45px 45px;
    position:relative;
    box-shadow:
        30px 35px 70px rgba(57,42,25,.22),
        inset 10px 0 20px rgba(255,255,255,.3);
    transform:rotate(-5deg);
    animation:float 5s ease-in-out infinite;
}

.hero-bottle:before{
    content:"";
    position:absolute;
    width:85px;
    height:75px;
    background:#24211e;
    top:-70px;
    left:82px;
    border-radius:7px 7px 3px 3px;
}

.hero-bottle:after{
    content:"ÉVRAUNE";
    position:absolute;
    background:#f4eee6;
    width:175px;
    height:100px;
    left:37px;
    top:145px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Cormorant Garamond',serif;
    font-size:23px;
    letter-spacing:4px;
    color:#171513;
}

@keyframes float{
    0%,100%{transform:translateY(0) rotate(-5deg)}
    50%{transform:translateY(-20px) rotate(-2deg)}
}

.orbit{
    position:absolute;
    width:520px;
    height:520px;
    border:1px solid rgba(0,0,0,.13);
    border-radius:50%;
}

.orbit:before{
    content:"";
    position:absolute;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#171513;
    top:50px;
    left:70px;
}

/* SECTION */

section{
    padding:110px 7%;
}

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:end;
    margin-bottom:55px;
}

.section-title{
    font-family:'Cormorant Garamond',serif;
    font-size:65px;
    font-weight:500;
}

.section-sub{
    max-width:350px;
    font-size:12px;
    line-height:1.8;
    color:#756e65;
}

/* PRODUCTS */

.products{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

.product{
    background:#ebe4da;
    padding:25px;
    position:relative;
    transition:.4s;
}

.product:hover{
    transform:translateY(-8px);
}

.product-image{
    height:430px;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

.product-bottle{
    width:135px;
    height:260px;
    border-radius:18px 18px 25px 25px;
    position:relative;
    box-shadow:20px 25px 40px rgba(0,0,0,.18);
}

.product-bottle:before{
    content:"";
    position:absolute;
    width:47px;
    height:52px;
    background:#26221f;
    top:-48px;
    left:44px;
    border-radius:5px 5px 2px 2px;
}

.product-bottle:after{
    content:"ÉVRAUNE";
    position:absolute;
    width:105px;
    height:65px;
    background:#f4eee6;
    left:15px;
    top:95px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Cormorant Garamond',serif;
    font-size:13px;
    letter-spacing:2px;
}

.bottle-one{
    background:linear-gradient(120deg,#80664d,#d8c3a5,#735a42);
}

.bottle-two{
    background:linear-gradient(120deg,#1f211e,#73746b,#191b18);
}

.bottle-three{
    background:linear-gradient(120deg,#c99d99,#ead0cb,#a66f6b);
}

.favorite{
    position:absolute;
    top:20px;
    right:20px;
    width:40px;
    height:40px;
    border-radius:50%;
    border:1px solid rgba(0,0,0,.15);
    background:rgba(255,255,255,.5);
    font-size:18px;
}

.product-info{
    border-top:1px solid rgba(0,0,0,.12);
    padding-top:22px;
}

.product-name{
    font-family:'Cormorant Garamond',serif;
    font-size:30px;
}

.product-type{
    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#777068;
    margin:7px 0 15px;
}

.product-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.price{
    font-size:14px;
    font-weight:500;
}

.add-btn{
    background:#171513;
    color:white;
    border:0;
    padding:12px 17px;
    font-size:10px;
    letter-spacing:1px;
}

/* STORY */

.story{
    background:#1c1a18;
    color:#f4eee6;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:100px;
    align-items:center;
}

.story h2{
    font-family:'Cormorant Garamond',serif;
    font-size:75px;
    line-height:.9;
    font-weight:400;
}

.story-text p{
    color:#b9b0a5;
    font-size:14px;
    line-height:2;
    margin-bottom:25px;
}

.line{
    width:80px;
    height:1px;
    background:#a99b8c;
    margin-bottom:35px;
}

/* NOTES */

.notes{
    text-align:center;
}

.notes-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-top:60px;
}

.note{
    padding:50px 20px;
    border:1px solid rgba(0,0,0,.12);
}

.note-number{
    font-family:'Cormorant Garamond',serif;
    font-size:45px;
    opacity:.3;
}

.note h3{
    font-family:'Cormorant Garamond',serif;
    font-size:32px;
    margin:10px 0;
}

.note p{
    font-size:12px;
    color:#756e65;
}

/* NEWSLETTER */

.newsletter{
    text-align:center;
    background:#e7ded2;
}

.newsletter h2{
    font-family:'Cormorant Garamond',serif;
    font-size:65px;
    font-weight:500;
}

.newsletter p{
    margin:20px auto 35px;
    max-width:450px;
    font-size:12px;
    line-height:1.8;
    color:#716960;
}

.email-box{
    display:flex;
    max-width:480px;
    margin:auto;
}

.email-box input{
    flex:1;
    border:1px solid #aaa095;
    border-right:0;
    background:transparent;
    padding:16px;
    outline:none;
}

.email-box button{
    border:0;
    background:#171513;
    color:white;
    padding:0 25px;
    letter-spacing:2px;
    font-size:10px;
}

/* FOOTER */

footer{
    background:#171513;
    color:#ddd5ca;
    padding:60px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.footer-logo{
    font-family:'Cormorant Garamond',serif;
    font-size:40px;
    letter-spacing:5px;
}

footer p{
    font-size:10px;
    color:#807970;
}

/* CART */

.cart-panel{
    position:fixed;
    top:0;
    right:-420px;
    width:min(420px,100%);
    height:100vh;
    background:#f5f1eb;
    z-index:2000;
    padding:35px;
    box-shadow:-20px 0 60px rgba(0,0,0,.2);
    transition:.4s;
}

.cart-panel.open{
    right:0;
}

.cart-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #ccc;
    padding-bottom:20px;
}

.cart-header h2{
    font-family:'Cormorant Garamond',serif;
    font-size:35px;
}

.close-cart{
    border:0;
    background:none;
    font-size:25px;
}

.cart-items{
    padding-top:25px;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    padding:18px 0;
    border-bottom:1px solid #ddd;
}

.cart-total{
    position:absolute;
    bottom:30px;
    left:35px;
    right:35px;
    display:flex;
    justify-content:space-between;
    border-top:1px solid #bbb;
    padding-top:20px;
}

/* MOBILE */

        padding:18px 5%;
    }

        font-size:27px;

    }

    }
